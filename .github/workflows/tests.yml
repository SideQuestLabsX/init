name: tests

# Runner, compiler and checkout revisions are pinned
# Apt packages follow the pinned Ubuntu archive because superseded versions disappear

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: host unit tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc-14
            pkg: gcc-14
          # Clang lists the sanitizer runtime as Recommends
          - cc: clang-18
            pkg: clang-18 libclang-rt-18-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}
      - name: run
        run: make test HOST_CC=${{ matrix.cc }}

  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cc: gcc-14
            pkgs: gcc-14
          - arch: x86
            cc: gcc-14
            pkgs: gcc-14-multilib
          - arch: aarch64
            cc: aarch64-linux-gnu-gcc-14
            pkgs: gcc-14-aarch64-linux-gnu
          - arch: armv7
            cc: arm-linux-gnueabihf-gcc-14
            pkgs: gcc-14-arm-linux-gnueabihf
          - arch: armv6
            cc: arm-linux-gnueabihf-gcc-14
            pkgs: gcc-14-arm-linux-gnueabihf
          - arch: riscv64
            cc: riscv64-linux-gnu-gcc-14
            pkgs: gcc-14-riscv64-linux-gnu
          - arch: loongarch64
            cc: loongarch64-linux-gnu-gcc-14
            pkgs: gcc-14-loongarch64-linux-gnu
          - arch: mips
            cc: mips-linux-gnu-gcc-14
            pkgs: gcc-14-mips-linux-gnu
          - arch: mipsel
            cc: mipsel-linux-gnu-gcc-14
            pkgs: gcc-14-mipsel-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }}
      - name: abi check
        run: make abi-check ARCH=${{ matrix.arch }} CC=${{ matrix.cc }}
      - name: build
        run: make ARCH=${{ matrix.arch }} CC=${{ matrix.cc }} all status-reader
      - name: build without PIE
        if: matrix.arch == 'x86_64'
        run: make ARCH=x86_64 CC=gcc-14 BUILD=build/x86_64-nonpie PIE=0
      - name: size
        run: size build/${{ matrix.arch }}/init

  variants:
    name: behavior with ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - OFFLINE_MODE=1
          - FEATURE_WATCHDOG=0
          - FEATURE_EXEC_PROBES=0
          - FEATURE_LOG_DISK=0
          - FEATURE_LOG_CAPTURE=0
          - FEATURE_CAPABILITY_DROP=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install compiler and tracing tools
        run: sudo apt-get update && sudo apt-get install -y gcc-14 strace time
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: run
        run: make test-variant CC=gcc-14 FEATURE_VARIANT='${{ matrix.variant }}'

  boot-namespace:
    name: namespace boot test (${{ matrix.tier }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tier: [auto, caps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install compiler and uid mapping helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 strace uidmap
          user=$(id -un)
          if ! grep -q "^${user}:" /etc/subuid; then
            echo "${user}:100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^${user}:" /etc/subgid; then
            echo "${user}:100000:65536" | sudo tee -a /etc/subgid
          fi
      # Ubuntu 24.04 AppArmor restricts unprivileged user namespaces
      # The harness reports a tier failure if this override fails
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: run
        run: make test-ns ARCH=x86_64 CC=gcc-14 INIT_NS_TIER=${{ matrix.tier }}
      - name: run fault injection
        if: matrix.tier == 'caps'
        run: make test-faults ARCH=x86_64 CC=gcc-14

  boot-qemu:
    name: qemu boot test (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install qemu and a kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 qemu-system-x86 linux-image-virtual
          sudo chmod +r /boot/vmlinuz-* || true
      - name: run
        run: make test-qemu ARCH=x86_64 CC=gcc-14

  boot-qemu-watchdog:
    name: qemu hardware watchdog reset
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install qemu, the compiler and kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex gcc-14 \
            libelf-dev libssl-dev qemu-system-x86
      - name: build the pinned watchdog kernel
        run: |
          QEMU_WATCHDOG=1 KERNEL_CC=gcc-14 \
            QEMU_KERNEL_ENV="$GITHUB_ENV" sh tools/build-qemu-kernel.sh x86_64
      - name: run
        run: make test-qemu-watchdog ARCH=x86_64 CC=gcc-14
        env:
          TIMEOUT: 30

  boot-qemu-aarch64:
    name: qemu boot test (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: add the arm64 package archive
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Architectures:/d; /^Components:/a Architectures: amd64' \
            /etc/apt/sources.list.d/ubuntu.sources
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security
          Components: main
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
      - name: install qemu, the compiler and an arm64 kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm gcc-14-aarch64-linux-gnu
          kernel_package=$(apt-cache depends linux-image-generic:arm64 | \
            sed -n 's/.*Depends: \(linux-image-[^ :]*\).*/\1/p' | head -n 1)
          test -n "$kernel_package"
          mkdir -p "$RUNNER_TEMP/arm64-kernel"
          cd "$RUNNER_TEMP/arm64-kernel"
          apt-get download "${kernel_package}:arm64"
          package=$(find . -maxdepth 1 -name "${kernel_package}_*_arm64.deb" -print -quit)
          test -n "$package"
          dpkg-deb -x "$package" root
          kernel=$(find root/boot -name 'vmlinuz-*' -print -quit)
          test -n "$kernel"
          echo "KERNEL=$PWD/$kernel" >> "$GITHUB_ENV"
      # Aarch64 TCG needs a longer timeout than x86_64
      - name: run
        run: make test-qemu ARCH=aarch64 CC=aarch64-linux-gnu-gcc-14
        env:
          TIMEOUT: 300

  boot-qemu-mips:
    name: qemu boot test (mips)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install qemu and the compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex gcc-14-mips-linux-gnu \
            gcc-mips-linux-gnu \
            libelf-dev libssl-dev qemu-system-mips
      - name: build the pinned Malta kernel
        run: QEMU_KERNEL_ENV="$GITHUB_ENV" sh tools/build-qemu-kernel.sh mips
      - name: run
        run: make test-qemu ARCH=mips CC=mips-linux-gnu-gcc-14
        env:
          TIMEOUT: 300

  boot-qemu-ports:
    name: qemu boot test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cc: gcc-14
            packages: gcc-14-multilib qemu-system-x86
          - arch: armv6
            cc: arm-linux-gnueabihf-gcc-14
            packages: gcc-arm-linux-gnueabihf gcc-14-arm-linux-gnueabihf qemu-system-arm
          - arch: armv7
            cc: arm-linux-gnueabihf-gcc-14
            packages: gcc-arm-linux-gnueabihf gcc-14-arm-linux-gnueabihf qemu-system-arm
          - arch: riscv64
            cc: riscv64-linux-gnu-gcc-14
            packages: gcc-riscv64-linux-gnu gcc-14-riscv64-linux-gnu qemu-system-misc
          - arch: loongarch64
            cc: loongarch64-linux-gnu-gcc-14
            packages: gcc-14-loongarch64-linux-gnu qemu-system-misc
          - arch: mipsel
            cc: mipsel-linux-gnu-gcc-14
            packages: gcc-mipsel-linux-gnu gcc-14-mipsel-linux-gnu qemu-system-mips
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install qemu and the compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev \
            ${{ matrix.packages }}
      - name: fetch LoongArch firmware
        if: matrix.arch == 'loongarch64'
        run: |
          firmware="$RUNNER_TEMP/QEMU_EFI.fd"
          curl -fsSL \
            https://raw.githubusercontent.com/yangxiaojuan-loongson/qemu-binary/a688a39a8be458aae7b6e5db20b0457eca67525f/QEMU_EFI.fd \
            -o "$firmware"
          echo "f55fbf5d92e885844631ae9bfa8887f659bbb4f6ef2beea9e9ff8bc0603b6697  $firmware" | sha256sum -c -
          echo "BIOS=$firmware" >> "$GITHUB_ENV"
      - name: build the pinned kernel
        run: QEMU_KERNEL_ENV="$GITHUB_ENV" sh tools/build-qemu-kernel.sh "${{ matrix.arch }}"
      - name: run
        run: make test-qemu ARCH=${{ matrix.arch }} CC=${{ matrix.cc }}
        env:
          TIMEOUT: 300
